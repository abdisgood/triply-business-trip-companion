<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plane-gradient-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="40" fill="url(#bg-gradient-large)"/>
  
  <!-- Main airplane body -->
  <path d="M55 90 L125 90 L135 80 L140 85 L130 95 L125 90 L115 100 L110 95 L120 85 L55 90 Z" 
        fill="url(#plane-gradient-large)" filter="url(#shadow)"/>
  
  <!-- Airplane wings -->
  <path d="M75 80 L105 80 L115 65 L120 70 L110 85 L75 85 Z" 
        fill="url(#plane-gradient-large)" filter="url(#shadow)"/>
  <path d="M75 95 L105 95 L115 110 L120 105 L110 90 L75 90 Z" 
        fill="url(#plane-gradient-large)" filter="url(#shadow)"/>
  
  <!-- Enhanced location pin -->
  <circle cx="50" cy="50" r="8" fill="#ff5722" filter="url(#shadow)"/>
  <path d="M50 42 L50 58 M42 50 L58 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
  
  <!-- Enhanced briefcase -->
  <rect x="130" y="120" width="30" height="20" rx="3" fill="#ffc107" filter="url(#shadow)"/>
  <rect x="135" y="115" width="20" height="5" rx="2" fill="#ffc107"/>
  <line x1="140" y1="130" x2="150" y2="130" stroke="#0d47a1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="145" cy="125" r="1" fill="#0d47a1"/>
  
  <!-- Enhanced route line -->
  <path d="M50 50 Q90 20 145 140" stroke="#4caf50" stroke-width="4" fill="none" 
        stroke-dasharray="8,4" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- Multiple destination markers -->
  <circle cx="90" cy="30" r="4" fill="#4caf50" filter="url(#shadow)"/>
  <circle cx="145" cy="140" r="4" fill="#4caf50" filter="url(#shadow)"/>
  <circle cx="120" cy="60" r="3" fill="#2196f3" filter="url(#shadow)"/>
  
  <!-- Flight path indicators -->
  <circle cx="70" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="110" cy="35" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="130" cy="100" r="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- App name hint -->
  <text x="90" y="165" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" opacity="0.9">Triply</text>
</svg> 